spring.application.name=project

server.port=8080
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always
# # db config
# spring.datasource.url=jdbc:postgresql://eCentrix.local:5432/db7
# spring.datasource.username=user7
# spring.datasource.password=userpass7
# spring.datasource.driver-class-name=org.postgresql.Driver

spring.data.redis.repositories.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.cache.type=redis

spring.jpa.show-sql=true

spring.datasource.url=jdbc:postgresql://localhost:5432/bootcamp
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# # jpa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# # logging
logging.pattern.console=%d{HH:mm:ss} [%thread{id}] [%-5p]%c{0}- %msg

# swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true

# scalar
springdoc.scalar.theme=deepSpace
springdoc.scalar.layout=modern
springdoc.scalar.documentDownloadType=both

springdoc.scalar.url=/api-docs
scalar.path=/docs
scalar.enabled=true

